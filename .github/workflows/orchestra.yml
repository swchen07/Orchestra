name: Orchestra checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-slim.txt
      - name: Install and build the local application
        run: python scripts/orchestra.py setup
      - name: Check launcher and module contracts
        run: |
          python -m unittest discover -s scripts/tests -v
          backend/.venv/bin/python -m unittest discover -s backend/tests/execution -v
        env:
          PYTHONPATH: backend
          USE_SLIM_DOCKER: 'true'
          WEBUI_SECRET_KEY: ci-only-nonproduction-key
          DATA_DIR: ${{ runner.temp }}/orchestra-data
      - name: Frontend module tests
        run: npx vitest run src/lib/components/execution src/lib/apis/execution
      - name: Verify immutable source locks
        run: git diff --exit-code -- package-lock.json static/pyodide/pyodide-lock.json
